<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LEGADO - Registro</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0A0A0A; font-family:Arial,sans-serif; padding:10px; color:#F5F0E8; }
        .container { max-width:450px; margin:0 auto; background:#1A1A1A; border:2px solid #C9A84C; border-radius:15px; padding:20px; }
        .logo { font-size:28px; font-weight:bold; color:#C9A84C; text-align:center; letter-spacing:4px; }
        .subtitulo { color:#E8D5A3; text-align:center; font-size:14px; margin:5px 0 20px; }
        .form-group { margin-bottom:15px; }
        .form-group label { display:block; font-size:14px; margin-bottom:5px; color:#E8D5A3; }
        .form-group label span { color:#E74C3C; }
        input, select { width:100%; padding:14px; font-size:16px; border-radius:10px; border:1px solid #333; background:#0A0A0A; color:#F5F0E8; }
        input:focus, select:focus { outline:none; border-color:#C9A84C; }
        input::placeholder { color:#555; }
        input:disabled { opacity:0.5; cursor:not-allowed; }
        .btn { padding:14px 20px; border-radius:10px; border:2px solid #C9A84C; background:transparent; color:#C9A84C; font-size:16px; font-weight:bold; cursor:pointer; transition:all 0.3s; min-height:50px; }
        .btn:active { transform:scale(0.97); }
        .btn:hover { background:#C9A84C; color:#0A0A0A; }
        .btn:disabled { opacity:0.4; cursor:not-allowed; border-color:#555; color:#555; transform:none; }
        .btn-principal { width:100%; background:#C9A84C; color:#0A0A0A; padding:16px; font-size:18px; }
        .btn-principal:hover { background:#E8D5A3; }
        .btn-principal:disabled { background:#555; color:#888; border-color:#555; cursor:not-allowed; }
        .resultado-verificacion { padding:12px 15px; border-radius:8px; margin-top:8px; font-size:14px; display:none; }
        .resultado-verificacion.exito { display:block; background:rgba(46,204,113,0.15); border:1px solid #2ECC71; color:#2ECC71; }
        .resultado-verificacion.error { display:block; background:rgba(231,76,60,0.15); border:1px solid #E74C3C; color:#E74C3C; }
        .resultado-verificacion.info { display:block; background:rgba(52,152,219,0.15); border:1px solid #3498DB; color:#3498DB; }
        .tipo-perfil { display:flex; gap:15px; flex-wrap:wrap; color:#F5F0E8; font-size:14px; margin:8px 0; }
        .tipo-perfil label { display:flex; align-items:center; gap:6px; cursor:pointer; }
        .tipo-perfil input[type="radio"] { width:18px; height:18px; accent-color:#C9A84C; }
        .checkbox { display:flex; align-items:center; gap:10px; color:#F5F0E8; font-size:13px; margin:10px 0; }
        .checkbox input[type="checkbox"] { width:18px; height:18px; accent-color:#C9A84C; }
        .checkbox label { cursor:pointer; }
        .enlace { color:#C9A84C; text-decoration:none; font-weight:bold; }
        .enlace:hover { text-decoration:underline; }
        .texto-centro { text-align:center; color:#8A7E6B; font-size:14px; margin:15px 0; }
        .footer { color:#8A7E6B; font-size:11px; text-align:center; margin-top:15px; letter-spacing:1px; }
        .email-verificar { display:flex; gap:10px; }
        .email-verificar input { flex:1; }
        .codigo-container { display:none; margin-top:10px; }
        .codigo-container.visible { display:block; }
        .codigo-container input { width:100%; padding:14px; font-size:16px; border-radius:10px; border:1px solid #C9A84C; background:#0A0A0A; color:#F5F0E8; text-align:center; letter-spacing:8px; }
        .sub-opciones { display:none; margin-top:10px; padding:10px; background:#0A0A0A; border-radius:10px; border:1px solid #333; }
        .sub-opciones.visible { display:block; }
        .sub-opciones label { display:block; font-size:13px; color:#E8D5A3; margin:5px 0; }
        .sub-opciones label input { width:auto; margin-right:8px; accent-color:#C9A84C; }
        @media (max-width:480px) { .container { padding:15px; } .logo { font-size:24px; } .email-verificar { flex-direction:column; } }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">LEGADO</div>
    <div class="subtitulo">Crear cuenta</div>
    <form id="registroForm" onsubmit="return false;">
        
        <div class="form-group">
            <label>Correo electrónico <span>*</span></label>
            <div class="email-verificar">
                <input type="email" id="emailInput" placeholder="tu@correo.com" inputmode="email" />
                <button type="button" class="btn" id="enviarCodigoBtn">Enviar código</button>
            </div>
            <div class="resultado-verificacion" id="resultadoVerificacion"></div>
        </div>

        <div class="codigo-container" id="codigoContainer">
            <div class="form-group">
                <label>Ingresa el código de 6 dígitos <span>*</span></label>
                <input type="text" id="codigoInput" placeholder="123456" maxlength="6" inputmode="numeric" />
                <button type="button" class="btn" id="verificarCodigoBtn" style="width:100%; margin-top:8px;">✅ Verificar código</button>
            </div>
        </div>

        <div class="form-group">
            <label>Contraseña <span>*</span></label>
            <input type="password" id="passwordInput" placeholder="Mínimo 6 caracteres" minlength="6" />
        </div>

        <div class="form-group">
            <label>Tipo de perfil <span>*</span></label>
            <div class="tipo-perfil">
                <label><input type="radio" name="perfil" value="empresa" checked /> Empresa</label>
                <label><input type="radio" name="perfil" value="trabajador" /> Trabajador</label>
                <label><input type="radio" name="perfil" value="fiscalizador" /> Fiscalizador</label>
                <label><input type="radio" name="perfil" value="gubernamental" id="gubernamentalRadio" /> Gubernamental</label>
            </div>
            
            <div class="sub-opciones" id="subGubernamental">
                <label style="color:#C9A84C; font-weight:bold;">🏛️ Selecciona tu institución:</label>
                <label><input type="radio" name="subperfil" value="ffaa" /> Fuerzas Armadas (FF.AA.)</label>
                <label><input type="radio" name="subperfil" value="pnp" /> Policía Nacional (PNP)</label>
                <label><input type="radio" name="subperfil" value="ministerio" /> Ministerio Público</label>
                <label><input type="radio" name="subperfil" value="poder-judicial" /> Poder Judicial</label>
                <label><input type="radio" name="subperfil" value="congreso" /> Congreso</label>
                <label><input type="radio" name="subperfil" value="gobierno-local" /> Gobierno Local (Municipalidad)</label>
                <label><input type="radio" name="subperfil" value="gobierno-regional" /> Gobierno Regional</label>
                <label><input type="radio" name="subperfil" value="ente-regulador" /> Ente Regulador</label>
                <label><input type="radio" name="subperfil" value="otro-gubernamental" /> Otro (especificar)</label>
                <input type="text" id="otroGubernamental" placeholder="Especifica tu institución" style="margin-top:5px; display:none;" />
            </div>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="terminosCheck" />
            <label for="terminosCheck">Acepto los Términos y Condiciones y la Política de Privacidad</label>
        </div>

        <button type="submit" class="btn btn-principal" id="registrarBtn" disabled>Completa todos los campos</button>
    </form>

    <div class="texto-centro">
        ¿Ya tienes cuenta? <a href="login.html" class="enlace">Inicia sesión</a>
        <br>
        <a href="index.html" class="enlace">Volver al inicio</a>
    </div>
    <div class="footer">LEGADO - Seguridad Laboral Automática - v1.0</div>
</div>

<script>
// ========================================
// 🔑 PON AQUÍ TUS 3 CLAVES DE EMAILJS
// ========================================
const EMAILJS_PUBLIC_KEY = 'TU_PUBLIC_KEY';
const EMAILJS_SERVICE_ID = 'TU_SERVICE_ID';
const EMAILJS_TEMPLATE_ID = 'TU_TEMPLATE_ID';

emailjs.init(EMAILJS_PUBLIC_KEY);

// ========================================
// VARIABLES
// ========================================
const emailInput = document.getElementById('emailInput');
const enviarCodigoBtn = document.getElementById('enviarCodigoBtn');
const codigoContainer = document.getElementById('codigoContainer');
const codigoInput = document.getElementById('codigoInput');
const verificarCodigoBtn = document.getElementById('verificarCodigoBtn');
const resultadoDiv = document.getElementById('resultadoVerificacion');
const passwordInput = document.getElementById('passwordInput');
const terminosCheck = document.getElementById('terminosCheck');
const registrarBtn = document.getElementById('registrarBtn');
const gubernamentalRadio = document.getElementById('gubernamentalRadio');
const subGubernamental = document.getElementById('subGubernamental');
const otroGubernamental = document.getElementById('otroGubernamental');

let emailVerificado = false;
let codigoGenerado = '';
let intentosFallidos = 0;
const MAX_INTENTOS = 3;

function mostrarResultado(mensaje, tipo) {
    resultadoDiv.textContent = mensaje;
    resultadoDiv.className = 'resultado-verificacion ' + tipo;
}

function limpiarResultado() {
    resultadoDiv.className = 'resultado-verificacion';
    resultadoDiv.textContent = '';
}

function actualizarBotonRegistro() {
    const emailValido = emailInput.value.includes('@') && emailInput.value.includes('.');
    const passwordValido = passwordInput.value.length >= 6;
    const terminosOk = terminosCheck.checked;
    const perfilSeleccionado = document.querySelector('input[name="perfil"]:checked');

    if (emailVerificado && emailValido && passwordValido && terminosOk && perfilSeleccionado) {
        registrarBtn.disabled = false;
        registrarBtn.textContent = 'Registrar';
    } else {
        registrarBtn.disabled = true;
        registrarBtn.textContent = 'Completa todos los campos';
    }
}

gubernamentalRadio.addEventListener('change', function() {
    if (this.checked) {
        subGubernamental.classList.add('visible');
    } else {
        subGubernamental.classList.remove('visible');
    }
    actualizarBotonRegistro();
});

document.querySelectorAll('input[name="subperfil"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
        if (this.value === 'otro-gubernamental') {
            otroGubernamental.style.display = 'block';
        } else {
            otroGubernamental.style.display = 'none';
        }
    });
});

// ========================================
// ENVIAR CÓDIGO REAL
// ========================================
function enviarCodigo() {
    const email = emailInput.value.trim();

    if (!email.includes('@') || !email.includes('.')) {
        mostrarResultado('❌ Ingresa un correo electrónico válido', 'error');
        return;
    }

    codigoGenerado = Math.floor(100000 + Math.random() * 900000).toString();
    intentosFallidos = 0;
    
    mostrarResultado('📧 Enviando código a ' + email + '...', 'info');
    enviarCodigoBtn.disabled = true;
    enviarCodigoBtn.textContent = 'Enviando...';

    const templateParams = {
        to_email: email,
        from_name: 'LEGADO',
        codigo: codigoGenerado,
        mensaje: 'Tu código de verificación LEGADO es: ' + codigoGenerado
    };

    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
        .then(function(response) {
            mostrarResultado('✅ Código enviado a ' + email + '. Revisa tu bandeja.', 'exito');
            codigoContainer.classList.add('visible');
            codigoInput.value = '';
            codigoInput.focus();
            enviarCodigoBtn.textContent = '✅ Enviado';
        })
        .catch(function(error) {
            mostrarResultado('❌ Error al enviar el código. Intenta de nuevo.', 'error');
            enviarCodigoBtn.disabled = false;
            enviarCodigoBtn.textContent = 'Reenviar código';
        });
}

// ========================================
// VERIFICAR CÓDIGO REAL
// ========================================
function verificarCodigo() {
    const codigoIngresado = codigoInput.value.trim();

    if (intentosFallidos >= MAX_INTENTOS) {
        mostrarResultado('❌ Demasiados intentos. Solicita un nuevo código.', 'error');
        codigoInput.disabled = true;
        verificarCodigoBtn.disabled = true;
        return;
    }

    if (codigoIngresado === codigoGenerado) {
        emailVerificado = true;
        mostrarResultado('✅ Correo verificado correctamente', 'exito');
        codigoContainer.classList.remove('visible');
        emailInput.disabled = true;
        enviarCodigoBtn.disabled = true;
        enviarCodigoBtn.textContent = '✅ Verificado';
        actualizarBotonRegistro();
    } else {
        intentosFallidos++;
        const restantes = MAX_INTENTOS - intentosFallidos;
        mostrarResultado('❌ Código incorrecto. Te quedan ' + restantes + ' intentos.', 'error');
        codigoInput.value = '';
        codigoInput.focus();
        if (intentosFallidos >= MAX_INTENTOS) {
            codigoInput.disabled = true;
            verificarCodigoBtn.disabled = true;
        }
    }
}

// ========================================
// EVENTOS
// ========================================

enviarCodigoBtn.addEventListener('click', enviarCodigo);
verificarCodigoBtn.addEventListener('click', verificarCodigo);

codigoInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        verificarCodigo();
    }
});

emailInput.addEventListener('input', function() {
    if (emailVerificado) {
        emailVerificado = false;
        emailInput.disabled = false;
        enviarCodigoBtn.disabled = false;
        enviarCodigoBtn.textContent = 'Enviar código';
        codigoContainer.classList.remove('visible');
        codigoInput.disabled = false;
        verificarCodigoBtn.disabled = false;
        intentosFallidos = 0;
        mostrarResultado('📧 Correo modificado, debes verificar nuevamente', 'info');
        actualizarBotonRegistro();
    }
});

document.querySelectorAll('input[name="perfil"]').forEach(function(radio) {
    radio.addEventListener('change', actualizarBotonRegistro);
});

passwordInput.addEventListener('input', actualizarBotonRegistro);
terminosCheck.addEventListener('change', actualizarBotonRegistro);

registrarBtn.addEventListener('click', function() {
    if (!this.disabled) {
        const perfil = document.querySelector('input[name="perfil"]:checked');
        let mensaje = '✅ Registro completado como: ' + perfil.value;
        if (perfil.value === 'gubernamental') {
            const sub = document.querySelector('input[name="subperfil"]:checked');
            if (sub) {
                mensaje += '\n🏛️ Institución: ' + sub.parentElement.textContent.trim();
            }
        }
        alert(mensaje);
    }
});
</script>
</body>
</html>
