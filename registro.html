<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGADO - Registro</title>
  <style>
    body { background: #0A0A0A; color: #F5F0E8; font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { background: #1A1A1A; border: 2px solid #C9A84C; border-radius: 20px; padding: 40px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 0 50px rgba(201,168,76,0.2); }
    h1 { color: #C9A84C; letter-spacing: 3px; margin-bottom: 30px; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #C9A84C; background: #0A0A0A; color: #F5F0E8; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; padding: 14px; margin-top: 15px; border-radius: 50px; background: #C9A84C; color: #0A0A0A; font-weight: bold; border: none; cursor: pointer; font-size: 1rem; }
    button:hover { background: #E8D5A3; }
    .error { color: #E74C3C; margin-top: 10px; }
    a { color: #C9A84C; }
  </style>
</head>
<body>
  <div class="container">
    <h1>REGISTRO</h1>
    <form id="registroForm">
      <input type="text" id="nombre" placeholder="Nombre completo">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Contraseña (mín. 6)" required>
      <select id="perfil">
        <option value="trabajador">Trabajador</option>
        <option value="empresa">Empresa</option>
        <option value="especialista">Especialista SST</option>
      </select>
      <button type="submit">Crear cuenta</button>
      <div class="error" id="mensaje"></div>
    </form>
    <p style="margin-top:20px;">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const perfil = document.getElementById('perfil').value;
      const mensaje = document.getElementById('mensaje');
      mensaje.textContent = '';

      try {
        const res = await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, nombre, perfil })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = 'perfil.html';
        } else {
          mensaje.textContent = data.error || 'Error en el registro';
        }
      } catch (err) {
        mensaje.textContent = 'Error de conexión con el servidor';
      }
    });
  </script>
</body>
</html>
