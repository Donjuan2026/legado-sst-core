<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - LEGADO SST</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f0e9d0;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1 span {
            background: #c9a84c;
            color: #0b1a2e;
            font-size: 14px;
            font-weight: 600;
            padding: 0 12px;
            border-radius: 40px;
            line-height: 26px;
        }
        .sub {
            color: #8fa8b9;
            font-size: 14px;
            margin-bottom: 28px;
            border-left: 3px solid #c9a84c;
            padding-left: 14px;
        }
        .grupo {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #d6dce5;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        label .obligatorio {
            color: #e74c3c;
        }
        input,
        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.10);
            background: rgba(0, 0, 0, 0.35);
            color: #f0f4fa;
            font-size: 15px;
            transition: 0.2s;
            outline: none;
        }
        input:focus,
        select:focus {
            border-color: #c9a84c;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.15);
        }
        input::placeholder {
            color: #6a7f8e;
            font-weight: 300;
        }
        .fila-codigo {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .fila-codigo input {
            flex: 1;
        }
        .fila-codigo button {
            background: #1e3a52;
            border: none;
            color: #d6dce5;
            font-weight: 600;
            font-size: 13px;
            padding: 0 18px;
            border-radius: 40px;
            height: 48px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .fila-codigo button:hover:not(:disabled) {
            background: #2a4a66;
            border-color: #c9a84c;
            color: #fff;
        }
        .fila-codigo button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .campo-codigo {
            display: none;
        }
        .campo-codigo.visible {
            display: block;
        }
        .mensaje-error {
            color: #f28b82;
            font-size: 13px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mensaje-exito {
            color: #81c995;
            font-size: 13px;
            margin-top: 6px;
        }
        .checkbox {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 16px 0 20px;
        }
        .checkbox input {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            margin-top: 2px;
            accent-color: #c9a84c;
        }
        .checkbox label {
            font-weight: 400;
            font-size: 14px;
            color: #bcc9d4;
            line-height: 1.5;
        }
        .checkbox label a {
            color: #c9a84c;
            text-decoration: none;
            font-weight: 500;
        }
        .checkbox label a:hover {
            text-decoration: underline;
        }
        .btn-primario {
            width: 100%;
            padding: 14px;
            background: #c9a84c;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 17px;
            color: #0b1a2e;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }
        .btn-primario:hover:not(:disabled) {
            background: #dbb95c;
            transform: scale(1.01);
            box-shadow: 0 8px 25px rgba(201, 168, 76, 0.25);
        }
        .btn-primario:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .pie {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .pie a {
            color: #c9a84c;
            text-decoration: none;
            font-weight: 500;
        }
        .pie a:hover {
            text-decoration: underline;
        }
        .pie .volver {
            color: #6a7f8e;
            font-weight: 400;
        }
        .version {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #3f5667;
            letter-spacing: 0.5px;
        }
        .oculto {
            display: none !important;
        }
        .badge-error {
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(231, 76, 60, 0.25);
            padding: 12px 16px;
            border-radius: 14px;
            color: #f28b82;
            font-size: 14px;
            margin-bottom: 16px;
        }
        @media (max-width: 500px) {
            .container {
                padding: 28px 18px;
            }
            .fila-codigo {
                flex-wrap: wrap;
            }
            .fila-codigo button {
                width: 100%;
                justify-content: center;
                height: 44px;
            }
            .pie {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>LEGADO <span>CREAR</span></h1>
        <div class="sub">Completa tus datos para activar tu perfil</div>

        <div id="globalError" class="badge-error oculto"></div>

        <div class="grupo">
            <label>Correo electrónico <span class="obligatorio">*</span></label>
            <input type="email" id="email" placeholder="tucorreo@empresa.com" />
            <div id="emailError" class="mensaje-error"></div>
        </div>

        <div class="grupo">
            <div class="fila-codigo">
                <button id="btnEnviarCodigo">📩 Enviar código</button>
                <span id="timer" style="color:#6a7f8e;font-size:14px;font-weight:500;"></span>
            </div>
            <div id="codigoStatus" class="mensaje-error"></div>
        </div>

        <div id="campoCodigo" class="grupo campo-codigo">
            <label>Código de verificación <span class="obligatorio">*</span></label>
            <input type="text" id="codigoInput" placeholder="Ej: 482391" maxlength="6" inputmode="numeric" />
            <div id="codigoError" class="mensaje-error"></div>
            <div style="margin-top:6px;font-size:12px;color:#5a7385;">
                Revisa tu bandeja de entrada (o spam). El código expira en 5 minutos.
            </div>
        </div>

        <div class="grupo">
            <label>Contraseña <span class="obligatorio">*</span></label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres" />
            <div id="passError" class="mensaje-error"></div>
        </div>

        <div class="grupo">
            <label>Tipo de perfil <span class="obligatorio">*</span></label>
            <select id="perfil">
                <option value="">Selecciona...</option>
                <option value="empresa">Empresa</option>
                <option value="trabajador">Trabajador</option>
                <option value="fiscalizador">Fiscalizador</option>
                <option value="gubernamental">Gubernamental</option>
            </select>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="terminos" />
            <label for="terminos">
                Acepto los <a href="#">Términos y Condiciones</a> y la
                <a href="#">Política de Privacidad</a>
            </label>
        </div>

        <button class="btn-primario" id="btnRegistrar" disabled>
            Crear cuenta
        </button>

        <div class="pie">
            <span>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></span>
            <a href="index.html" class="volver">← Volver al inicio</a>
        </div>

        <div class="version">LEGADO - Seguridad Laboral Automática - v1.0</div>
    </div>

    <script>
        // ============================================================
        //  CONFIGURACIÓN EMAILJS - ¡CAMBIAR AQUÍ!
        // ============================================================
        const EMAILJS_SERVICE = 'service_s65kky';
        const EMAILJS_TEMPLATE = 'AQUI_EL_ID_DE_TU_PLANTILLA'; // ← CAMBIA ESTO
        const EMAILJS_PUBLIC_KEY = '8qj_1tDP9zNfYLkVI';

        emailjs.init(EMAILJS_PUBLIC_KEY);

        let codigoGenerado = '';
        let codigoEnviado = false;
        let codigoVerificado = false;
        let timerInterval = null;
        let segundosRestantes = 0;

        const $ = (id) => document.getElementById(id);
        const email = $('email');
        const btnEnviar = $('btnEnviarCodigo');
        const timerSpan = $('timer');
        const campoCodigo = $('campoCodigo');
        const codigoInput = $('codigoInput');
        const codigoStatus = $('codigoStatus');
        const codigoError = $('codigoError');
        const emailError = $('emailError');
        const password = $('password');
        const passError = $('passError');
        const perfil = $('perfil');
        const terminos = $('terminos');
        const btnRegistrar = $('btnRegistrar');
        const globalError = $('globalError');

        function generarCodigo() {
            return String(Math.floor(100000 + Math.random() * 900000));
        }

        async function enviarCodigo() {
            const correo = email.value.trim();

            if (!correo || !correo.includes('@')) {
                emailError.textContent = '⚠️ Ingresa un correo válido.';
                return;
            }
            emailError.textContent = '';

            codigoGenerado = generarCodigo();
            codigoEnviado = true;
            codigoVerificado = false;
            campoCodigo.classList.remove('visible');
            codigoInput.value = '';
            codigoStatus.textContent = '⏳ Enviando...';
            codigoStatus.style.color = '#d6dce5';

            try {
                const response = await emailjs.send(
                    EMAILJS_SERVICE,
                    EMAILJS_TEMPLATE, {
                        to_email: correo,
                        name: 'Usuario',
                        code: codigoGenerado
                    }
                );

                console.log('✅ EmailJS response:', response);
                campoCodigo.classList.add('visible');
                codigoStatus.textContent = '✅ Código enviado a tu correo.';
                codigoStatus.style.color = '#81c995';
                iniciarTimer(300);
                globalError.classList.add('oculto');

            } catch (error) {
                console.error('❌ Error EmailJS:', error);
                codigoStatus.textContent = '✖ Error al enviar el código. Intenta de nuevo.';
                codigoStatus.style.color = '#f28b82';
                codigoEnviado = false;
            }
        }

        function iniciarTimer(segundos) {
            if (timerInterval) clearInterval(timerInterval);
            segundosRestantes = segundos;
            btnEnviar.disabled = true;
            actualizarTimer();

            timerInterval = setInterval(() => {
                segundosRestantes--;
                actualizarTimer();
                if (segundosRestantes <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    btnEnviar.disabled = false;
                    timerSpan.textContent = '';
                    codigoStatus.textContent = '⏰ El código expiró. Envía uno nuevo.';
                    codigoStatus.style.color = '#f28b82';
                    campoCodigo.classList.remove('visible');
                    codigoEnviado = false;
                    codigoVerificado = false;
                }
            }, 1000);
        }

        function actualizarTimer() {
            const m = Math.floor(segundosRestantes / 60);
            const s = segundosRestantes % 60;
            timerSpan.textContent = `${m}:${s.toString().padStart(2, '0')}`;
        }

        function validarCodigo() {
            const ingresado = codigoInput.value.trim();
            if (!codigoEnviado) {
                codigoError.textContent = '⚠️ Primero envía el código a tu correo.';
                codigoVerificado = false;
                return;
            }
            if (ingresado.length < 6) {
                codigoError.textContent = '⚠️ El código tiene 6 dígitos.';
                codigoVerificado = false;
                return;
            }
            if (ingresado === codigoGenerado) {
                codigoError.textContent = '✅ Código verificado correctamente.';
                codigoError.style.color = '#81c995';
                codigoVerificado = true;
                globalError.classList.add('oculto');
            } else {
                codigoError.textContent = '✖ Código incorrecto. Intenta de nuevo.';
                codigoError.style.color = '#f28b82';
                codigoVerificado = false;
            }
            verificarFormulario();
        }

        function verificarFormulario() {
            const pass = password.value.trim();
            const perfilVal = perfil.value;
            const terminosOk = terminos.checked;
            const emailOk = email.value.trim().includes('@');

            let valido = true;

            if (!emailOk) {
                emailError.textContent = '⚠️ Ingresa un correo válido.';
                valido = false;
            } else {
                emailError.textContent = '';
            }

            if (pass.length < 6) {
                passError.textContent = '⚠️ Mínimo 6 caracteres.';
                valido = false;
            } else {
                passError.textContent = '';
            }

            if (!perfilVal) valido = false;
            if (!terminosOk) valido = false;
            if (!codigoVerificado) valido = false;
            if (!codigoEnviado) valido = false;

            btnRegistrar.disabled = !valido;
        }

        function registrar() {
            if (btnRegistrar.disabled) {
                globalError.textContent = '⚠️ Completa todos los campos correctamente.';
                globalError.classList.remove('oculto');
                return;
            }

            const datos = {
                email: email.value.trim(),
                password: password.value.trim(),
                perfil: perfil.value,
                codigo: codigoInput.value.trim(),
                fecha: new Date().toISOString()
            };

            console.log('📦 Registro completado:', datos);
            alert('✅ ¡Cuenta creada exitosamente! Bienvenido a LEGADO.');
        }

        btnEnviar.addEventListener('click', enviarCodigo);
        codigoInput.addEventListener('input', validarCodigo);
        email.addEventListener('input', verificarFormulario);
        password.addEventListener('input', verificarFormulario);
        perfil.addEventListener('change', verificarFormulario);
        terminos.addEventListener('change', verificarFormulario);
        btnRegistrar.addEventListener('click', registrar);

        verificarFormulario();

        console.log('✅ LEGADO Registro v1.0 cargado correctamente.');
    </script>

</body>
</html>
