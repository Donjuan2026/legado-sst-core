<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LEGADO - Registro</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0A;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #1A1A1A;
            border: 2px solid #C9A84C;
            border-radius: 20px;
            padding: 40px 35px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 0 50px rgba(201, 168, 76, 0.2);
            position: relative;
        }

        /* IDIOMAS */
        .idiomas {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .idioma-btn {
            background: transparent;
            border: 1px solid #C9A84C;
            color: #C9A84C;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .idioma-btn:hover {
            background: #C9A84C;
            color: #0A0A0A;
            transform: scale(1.05);
        }

        .idioma-btn.activo {
            background: #C9A84C;
            color: #0A0A0A;
            font-weight: bold;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #C9A84C;
            letter-spacing: 6px;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitulo {
            color: #E8D5A3;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #F5F0E8;
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group label span {
            color: #E74C3C;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #0A0A0A;
            color: #F5F0E8;
            font-size: 1rem;
            transition: border 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #C9A84C;
            box-shadow: 0 0 15px rgba(201, 168, 76, 0.2);
        }

        .form-group input::placeholder {
            color: #555;
        }

        .dni-verificar {
            display: flex;
            gap: 10px;
        }

        .dni-verificar input {
            flex: 1;
        }

        .btn-verificar {
            background: transparent;
            border: 2px solid #C9A84C;
            color: #C9A84C;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-verificar:hover {
            background: #C9A84C;
            color: #0A0A0A;
        }

        .btn-verificar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-verificar.verificado {
            background: #2ECC71;
            border-color: #2ECC71;
            color: #0A0A0A;
        }

        .btn-registrar {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            background: #C9A84C;
            color: #0A0A0A;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-registrar:hover {
            background: #E8D5A3;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.4);
        }

        .btn-registrar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .terminos {
            color: #8A7E6B;
            font-size: 0.75rem;
            margin: 15px 0;
            text-align: center;
        }

        .terminos a {
            color: #C9A84C;
            text-decoration: none;
        }

        .terminos a:hover {
            text-decoration: underline;
        }

        .footer {
            color: #8A7E6B;
            font-size: 0.7rem;
            text-align: center;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .mensaje-error {
            color: #E74C3C;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }

        .mensaje-exito {
            color: #2ECC71;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }

        .tipo-perfil {
            display: flex;
            gap: 20px;
            color: #F5F0E8;
            font-size: 0.9rem;
            margin: 10px 0;
        }

        .tipo-perfil label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .tipo-perfil input[type="radio"] {
            accent-color: #C9A84C;
            width: 16px;
            height: 16px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #F5F0E8;
            font-size: 0.8rem;
            margin: 10px 0;
        }

        .checkbox input[type="checkbox"] {
            accent-color: #C9A84C;
            width: 16px;
            height: 16px;
        }

        .enlace {
            color: #C9A84C;
            text-decoration: none;
            font-weight: 500;
        }

        .enlace:hover {
            text-decoration: underline;
        }

        .texto-centro {
            text-align: center;
            color: #8A7E6B;
            font-size: 0.85rem;
            margin: 10px 0;
        }

        .resultado-verificacion {
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 5px;
            display: none;
            font-size: 0.9rem;
        }

        .resultado-verificacion.exito {
            display: block;
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid #2ECC71;
            color: #2ECC71;
        }

        .resultado-verificacion.error {
            display: block;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid #E74C3C;
            color: #E74C3C;
        }

        .datos-verificados {
            display: none;
            background: rgba(201, 168, 76, 0.1);
            border: 1px solid #C9A84C;
            border-radius: 10px;
            padding: 12px 15px;
            margin-top: 8px;
            color: #F5F0E8;
            font-size: 0.9rem;
        }

            display: block;
        }

            color: #C9A84C;
        }

            .container {

                justify-content: center;

                gap: 8px;

<div class="container">

    <!-- IDIOMAS -->
    <div class="idiomas">
        <button class="idioma-btn activo" data-lang="es">🇪🇸 ES</button>
        <button class="idioma-btn" data-lang="en">🇬🇧 EN</button>

    </div>

    <!-- LOGO -->

    <div class="subtitulo" data-key="subtitulo">Crear cuenta</div>

    <form id="registroForm" onsubmit="return false;">

        <!-- DNI -->
        <div class="form-group">
            <label data-key="dni-label">Documento de Identidad (DNI) <span>*</span></label>
            <div class="dni-verificar">
                <input type="text" id="dniInput" placeholder="Ej: 12345678" maxlength="8" />
                <button type="button" class="btn-verificar" id="verificarBtn" data-key="verificar">Verificar</button>
            </div>
            <div class="resultado-verificacion" id="resultadoVerificacion"></div>
            <div class="datos-verificados" id="datosVerificados">
                <strong data-key="identidad-verificada">IDENTIDAD VERIFICADA</strong><br />
                <span id="nombreVerificado">MIGUEL ANGEL TORRES PEREZ</span><br />
                <small>DNI: <span id="dniVerificado">12345678</span></small>
            </div>
        </div>

        <!-- NOMBRES (autocompletado) -->
        <div class="form-group">
            <label data-key="nombre-label">Nombres completos <span>*</span></label>
            <input type="text" id="nombreInput" placeholder="Ej: Juan Carlos" readonly style="background: #111; cursor: not-allowed;" />
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label data-key="email-label">Correo electrónico <span>*</span></label>
            <input type="email" id="emailInput" placeholder="tu@correo.com" />
        </div>

        <!-- CONTRASEÑA -->
        <div class="form-group">
            <label data-key="password-label">Contraseña <span>*</span></label>
            <input type="password" id="passwordInput" placeholder="Mínimo 6 caracteres" minlength="6" />
        </div>

        <!-- TIPO DE PERFIL -->
        <div class="form-group">
            <label data-key="perfil-label">Tipo de perfil</label>
            <div class="tipo-perfil">
                <label><input type="radio" name="perfil" value="empresa" checked /> <span data-key="empresa">Empresa</span></label>
                <label><input type="radio" name="perfil" value="trabajador" /> <span data-key="trabajador">Trabajador</span></label>
                <label><input type="radio" name="perfil" value="fiscalizador" /> <span data-key="fiscalizador">Fiscalizador</span></label>
            </div>
        </div>

        <!-- TÉRMINOS -->
        <div class="checkbox">
            <input type="checkbox" id="terminosCheck" />
            <label for="terminosCheck" data-key="terminos">Acepto los Términos y Condiciones y la Política de Privacidad</label>
        </div>

        <!-- BOTÓN REGISTRAR -->
        <button type="submit" class="btn-registrar" id="registrarBtn" disabled data-key="registrar">Completa todos los campos</button>

    </form>

    <div class="texto-centro">
        <span data-key="ya-tienes">¿Ya tienes cuenta?</span>
        <a href="login.html" class="enlace" data-key="iniciar-sesion">Inicia sesión</a>
        <br>
        <a href="index.html" class="enlace" data-key="volver-inicio">Volver al inicio</a>
    </div>

    <div class="footer" data-key="footer">LEGADO - Seguridad Laboral Automática - v1.0</div>

</div>

<!-- LÓGICA DE IDIOMAS + VERIFICACIÓN DNI REAL     -->
<!-- ============================================= -->
<script>
    (function() {
        // -------- IDIOMAS --------
        const elementos = {};
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (!elementos[key]) elementos[key] = [];
            elementos[key].push(el);
        });

        const botones = document.querySelectorAll('.idioma-btn');
        let idiomaActual = 'es';

        function cambiarIdioma(idioma) {
            if (!traducciones[idioma]) return;
            idiomaActual = idioma;
            const datos = traducciones[idioma];
            Object.keys(datos).forEach(key => {
                if (elementos[key]) {
                    elementos[key].forEach(el => {
                        el.textContent = datos[key];
                    });
                }
            });
            botones.forEach(btn => {
                btn.classList.remove('activo');
                if (btn.getAttribute('data-lang') === idioma) {
                    btn.classList.add('activo');
                }
            });
            document.documentElement.lang = idioma;
            localStorage.setItem('legado-idioma', idioma);
        }

        botones.forEach(btn => {
            btn.addEventListener('click', function() {
                cambiarIdioma(this.getAttribute('data-lang'));
            });
        });

        const guardado = localStorage.getItem('legado-idioma');
        if (guardado && traducciones[guardado]) {
            cambiarIdioma(guardado);
        } else {
            const navLang = navigator.language.split('-')[0];
            if (traducciones[navLang]) {
                cambiarIdioma(navLang);
            } else {
                cambiarIdioma('es');
            }
        }

        // -------- VERIFICACIÓN DNI (REAL - SIN DEMO) --------
        const dniInput = document.getElementById('dniInput');
        const verificarBtn = document.getElementById('verificarBtn');
        const nombreInput = document.getElementById('nombreInput');
        const resultadoDiv = document.getElementById('resultadoVerificacion');
        const datosDiv = document.getElementById('datosVerificados');
        const nombreVerificado = document.getElementById('nombreVerificado');
        const dniVerificadoSpan = document.getElementById('dniVerificado');
        const registrarBtn = document.getElementById('registrarBtn');
        const terminosCheck = document.getElementById('terminosCheck');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');

        let dniVerificado = false;
        let datosVerificados = null;

        function mostrarResultado(mensaje, tipo) {
            resultadoDiv.textContent = mensaje;
            resultadoDiv.className = 'resultado-verificacion ' + tipo;
        }

        function limpiarResultado() {
            resultadoDiv.className = 'resultado-verificacion';
            resultadoDiv.textContent = '';
            datosDiv.classList.remove('visible');
        }

        function verificarDNI() {
            const dni = dniInput.value.trim();

            // Validar formato
            if (!/^\d{8}$/.test(dni)) {
                mostrarResultado(
                    traducciones[idiomaActual]['dni-error'] || 'DNI inválido (debe tener 8 dígitos)',
                    'error'
                );
                dniVerificado = false;
                nombreInput.value = '';
                verificarBtn.classList.remove('verificado');
                datosDiv.classList.remove('visible');
                actualizarBotonRegistro();
                return;
            }

            // Mostrar estado de verificación
            verificarBtn.textContent = traducciones[idiomaActual]['verificando'] || 'Verificando...';
            verificarBtn.disabled = true;
            limpiarResultado();

            // CONSULTA A API REAL
            // Reemplaza 'TU_TOKEN_AQUI' con tu token real
            fetch(`https://api.apis.net.pe/v2/reniec/dni?numero=${dni}`, {
                headers: {
                    'Authorization': 'Bearer TU_TOKEN_AQUI'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error en la respuesta de la API');
                }
                return response.json();
            })
            .then(data => {
                if (data.nombres && data.apellidoPaterno) {
                    const nombreCompleto = `${data.nombres} ${data.apellidoPaterno} ${data.apellidoMaterno || ''}`.trim();
                    nombreInput.value = nombreCompleto;
                    nombreVerificado.textContent = nombreCompleto.toUpperCase();
                    dniVerificadoSpan.textContent = dni;
                    dniVerificado = true;
                    datosVerificados = data;
                    verificarBtn.classList.add('verificado');
                    
                    // Mostrar datos verificados SIN DEMO
                    datosDiv.classList.add('visible');
                    
                    mostrarResultado(
                        traducciones[idiomaActual]['verificado-exito'] || '✅ Identidad verificada correctamente',
                        'exito'
                    );
                } else {
                    dniVerificado = false;
                    nombreInput.value = '';
                    verificarBtn.classList.remove('verificado');
                    datosDiv.classList.remove('visible');
                    mostrarResultado(
                        traducciones[idiomaActual]['verificado-error'] || '❌ DNI no encontrado',
                        'error'
                    );
                }
                verificarBtn.textContent = traducciones[idiomaActual]['verificar'] || 'Verificar';
                verificarBtn.disabled = false;
                actualizarBotonRegistro();
            })
            .catch(error => {
                console.error('Error al verificar DNI:', error);
                dniVerificado = false;
                nombreInput.value = '';
                verificarBtn.classList.remove('verificado');
                datosDiv.classList.remove('visible');
                mostrarResultado(
                    traducciones[idiomaActual]['verificado-error-red'] || '⚠️ Error de conexión',
                    'error'
                );
                verificarBtn.textContent = traducciones[idiomaActual]['verificar'] || 'Verificar';
                verificarBtn.disabled = false;
                actualizarBotonRegistro();
            });
        }

        function actualizarBotonRegistro() {
            const emailValido = emailInput.value.includes('@') && emailInput.value.includes('.');
            const passwordValido = passwordInput.value.length >= 6;
            const terminosOk = terminosCheck.checked;

            if (dniVerificado && emailValido && passwordValido && terminosOk) {
                registrarBtn.disabled = false;
                registrarBtn.textContent = traducciones[idiomaActual]['registrar'] || 'Registrar';
            } else {
                registrarBtn.disabled = true;
                registrarBtn.textContent = traducciones[idiomaActual]['registrar'] || 'Completa todos los campos';
            }
        }

        // Eventos
        verificarBtn.addEventListener('click', verificarDNI);

        dniInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 8);
            if (this.value.length === 8) {
                verificarDNI();
            } else {
                dniVerificado = false;
                nombreInput.value = '';
                verificarBtn.classList.remove('verificado');
                datosDiv.classList.remove('visible');
                limpiarResultado();
                actualizarBotonRegistro();
            }
        });

        emailInput.addEventListener('input', actualizarBotonRegistro);
        passwordInput.addEventListener('input', actualizarBotonRegistro);
        terminosCheck.addEventListener('change', actualizarBotonRegistro);

        // Registro
        registrarBtn.addEventListener('click', function() {
            if (!this.disabled) {
                alert('✅ Registro completado exitosamente');
                // Aquí puedes enviar los datos a tu backend
            }
        });

        // Actualizar textos de los botones al cambiar idioma
        const originalCambiar = cambiarIdioma;
        cambiarIdioma = function(idioma) {
            originalCambiar(idioma);
            verificarBtn.textContent = traducciones[idioma]['verificar'] || 'Verificar';
            registrarBtn.textContent = traducciones[idioma]['registrar'] || 'Completa todos los campos';
        };
        window.cambiarIdioma = cambiarIdioma;

    })();
</script>

</body>
</html>
