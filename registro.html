<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEGADO - Registro</title>
    <style>
        :root {
            --negro-profundo: #0A0A0A;
            --negro-carbon: #1A1A1A;
            --dorado-epico: #C9A84C;
            --dorado-claro: #E8D5A3;
            --blanco-roto: #F5F0E8;
            --gris-calido: #8A7E6B;
            --rojo-alerta: #E74C3C;
            --verde-exito: #2ECC71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--negro-profundo);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--blanco-roto);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 440px;
            width: 100%;
            background: var(--negro-carbon);
            border-radius: 32px;
            padding: 40px 28px 35px;
            border: 1px solid rgba(201, 168, 76, 0.12);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -40%;
            width: 180%;
            height: 180%;
            background: radial-gradient(ellipse at 20% 20%, rgba(201, 168, 76, 0.04), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .logo {
            position: relative;
            z-index: 1;
            margin-bottom: 24px;
        }

        .logo h1 {
            font-family: 'Georgia', serif;
            font-size: 28px;
            color: var(--dorado-epico);
            letter-spacing: 6px;
        }

        .logo .sub {
            font-size: 11px;
            color: var(--gris-calido);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .form-title {
            position: relative;
            z-index: 1;
            font-size: 22px;
            font-weight: 300;
            margin-bottom: 4px;
        }

        .form-subtitle {
            position: relative;
            z-index: 1;
            font-size: 14px;
            color: var(--gris-calido);
            margin-bottom: 24px;
        }

        .form-subtitle span {
            color: var(--dorado-epico);
        }

        .input-group {
            position: relative;
            z-index: 1;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--gris-calido);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .input-group label .requerido {
            color: var(--rojo-alerta);
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            background: var(--negro-profundo);
            border: 1px solid rgba(201, 168, 76, 0.08);
            border-radius: 12px;
            color: var(--blanco-roto);
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--dorado-epico);
        }

        .input-group select option {
            background: var(--negro-carbon);
            color: var(--blanco-roto);
        }

        .input-group .input-con-verificacion {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group .input-con-verificacion input {
            flex: 1;
        }

        .btn-verificar {
            padding: 14px 16px;
            background: var(--negro-profundo);
            border: 1px solid rgba(201, 168, 76, 0.15);
            border-radius: 12px;
            color: var(--dorado-claro);
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-verificar:hover:not(:disabled) {
            border-color: var(--dorado-epico);
            background: rgba(201, 168, 76, 0.05);
        }

        .btn-verificar:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-verificar.valido {
            border-color: var(--verde-exito);
            color: var(--verde-exito);
        }

        .btn-verificar.invalido {
            border-color: var(--rojo-alerta);
            color: var(--rojo-alerta);
        }

        .btn-verificar.verificando {
            color: var(--gris-calido);
            border-color: var(--gris-calido);
        }

        .btn-dorado {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--dorado-epico), #B8942E);
            color: var(--negro-profundo);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 25px rgba(201, 168, 76, 0.15);
        }

        .btn-dorado:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(201, 168, 76, 0.3);
        }

        .btn-dorado:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 40px;
            cursor: pointer;
            color: var(--gris-calido);
            font-size: 18px;
            background: transparent;
            border: none;
        }

        .link {
            position: relative;
            z-index: 1;
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: var(--gris-calido);
            text-decoration: none;
        }

        .link:hover {
            color: var(--dorado-claro);
        }

        .mensaje {
            position: relative;
            z-index: 1;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }

        .mensaje.error { color: var(--rojo-alerta); }
        .mensaje.exito { color: var(--verde-exito); }

        .footer {
            position: relative;
            z-index: 1;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(201, 168, 76, 0.05);
            font-size: 11px;
            color: var(--gris-calido);
        }

        .footer strong { color: var(--dorado-epico); }

        .terminos {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--gris-calido);
            margin: 12px 0 16px;
            text-align: left;
        }

        .terminos input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--dorado-epico);
            cursor: pointer;
        }

        .terminos a {
            color: var(--dorado-epico);
            text-decoration: none;
        }

        .terminos a:hover {
            text-decoration: underline;
        }

        .feedback-text {
            font-size: 12px;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        @media (max-width: 420px) {
            .container { padding: 28px 16px 24px; }
            .logo h1 { font-size: 24px; }
            .input-group .input-con-verificacion {
                flex-direction: column;
            }
            .btn-verificar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="logo">
            <h1>LEGADO</h1>
            <div class="sub">✦ Seguridad Laboral Automática ✦</div>
        </div>

        <div class="form-title">📝 Crear cuenta</div>
        <div class="form-subtitle">Comienza tu viaje con <span>LEGADO</span></div>

        <!-- ============================================ -->
        <!-- CORREO ELECTRÓNICO CON VERIFICACIÓN -->
        <!-- ============================================ -->
        <div class="input-group">
            <label for="regEmail">Correo electrónico <span class="requerido">*</span></label>
            <div class="input-con-verificacion">
                <input type="email" id="regEmail" placeholder="tu@correo.com" />
                <button class="btn-verificar" id="btnVerificarEmail">📧 Verificar</button>
            </div>
            <div style="font-size:11px;color:var(--gris-calido);margin-top:4px;">
                Te enviaremos un código de 6 dígitos para confirmar tu identidad
            </div>
        </div>

        <!-- CÓDIGO DE VERIFICACIÓN (se muestra después de enviar) -->
        <div class="input-group" id="grupoCodigo" style="display:none;">
            <label for="regCodigo">Código de verificación <span class="requerido">*</span></label>
            <div class="input-con-verificacion">
                <input type="text" id="regCodigo" placeholder="Ingresa código de 6 dígitos" maxlength="6" />
                <button class="btn-verificar" id="btnConfirmarCodigo">✅ Confirmar</button>
            </div>
            <div style="font-size:11px;color:var(--gris-calido);margin-top:4px;">
                ⏱️ Código válido por 5 minutos | <a href="#" id="reenviarCodigo" style="color:var(--dorado-epico);">Reenviar código</a>
            </div>
        </div>

        <div id="emailFeedback" class="feedback-text"></div>

        <!-- ============================================ -->
        <!-- CONTRASEÑA -->
        <!-- ============================================ -->
        <div class="input-group" style="position:relative;">
            <label for="regPassword">Contraseña <span class="requerido">*</span></label>
            <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" />
            <button class="toggle-password" id="togglePassword" type="button" aria-label="Mostrar contraseña">👁️</button>
        </div>

        <!-- ============================================ -->
        <!-- TIPO DE PERFIL -->
        <!-- ============================================ -->
        <div class="input-group">
            <label for="regNivel">Tipo de perfil</label>
            <select id="regNivel">
                <option value="trabajador">👷 Trabajador</option>
                <option value="empresa" selected>🏢 Empresa</option>
                <option value="especialista">👨‍🔬 Especialista SST</option>
                <option value="gubernamental">🏛️ Gubernamental (Estado)</option>
            </select>
        </div>

        <!-- ============================================ -->
        <!-- TÉRMINOS -->
        <!-- ============================================ -->
        <div class="terminos">
            <input type="checkbox" id="checkTerminos" />
            <label for="checkTerminos">
                Acepto los <a href="#">Términos y Condiciones</a> y la
                <a href="#">Política de Privacidad</a>
            </label>
        </div>

        <!-- ============================================ -->
        <!-- BOTÓN REGISTRO -->
        <!-- ============================================ -->
        <button class="btn-dorado" id="btnRegister" disabled>Verifica tu correo primero</button>

        <div class="mensaje" id="mensaje"></div>

        <a href="login.html" class="link">¿Ya tienes cuenta? 🔐 Inicia sesión</a>

        <div class="footer">
            ⚡ <strong>LEGADO</strong> · Seguridad Laboral Automática · v1.0
        </div>

    </div>

    <script>
        // ============================================
        //  ELEMENTOS DOM
        // ============================================
        const regEmail = document.getElementById('regEmail');
        const regPassword = document.getElementById('regPassword');
        const regNivel = document.getElementById('regNivel');
        const checkTerminos = document.getElementById('checkTerminos');
        const btnRegister = document.getElementById('btnRegister');
        const mensaje = document.getElementById('mensaje');

        // ============================================
        //  VERIFICACIÓN DE EMAIL
        // ============================================
        const btnVerificarEmail = document.getElementById('btnVerificarEmail');
        const grupoCodigo = document.getElementById('grupoCodigo');
        const codigoInput = document.getElementById('regCodigo');
        const btnConfirmarCodigo = document.getElementById('btnConfirmarCodigo');
        const reenviarLink = document.getElementById('reenviarCodigo');
        const emailFeedback = document.getElementById('emailFeedback');

        let emailVerificado = false;
        let codigoEnviado = false;
        let codigoActual = '';
        let temporizadorExpiracion = null;

        // ============================================
        //  TOGGLE CONTRASEÑA
        // ============================================
        document.getElementById('togglePassword').addEventListener('click', function() {
            const type = regPassword.type === 'password' ? 'text' : 'password';
            regPassword.type = type;
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // ============================================
        //  VERIFICACIÓN DE EMAIL CON BREVO
        // ============================================
        function generarCodigo() {
            return String(Math.floor(100000 + Math.random() * 900000));
        }

        async function enviarCodigoBrevo(email, codigo) {
            try {
                const BREVO_API_KEY = 'BREVO_KEY_REMOVIDA';

                const response = await fetch('https://api.brevo.com/v3/smtp/email', {
                    method: 'POST',
                    headers: {
                        'api-key': BREVO_API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sender: {
                            name: 'LEGADO SST',
                            email: 'jagc7movil@gmail.com'
                        },
                        to: [{
                            email: email,
                            name: 'Usuario LEGADO'
                        }],
                        subject: '🔐 Código de verificación - LEGADO SST',
                        htmlContent: `
                            <html>
                            <body style="font-family: Arial, sans-serif; background: #0A0A0A; padding: 40px; color: #F5F0E8;">
                                <div style="max-width: 500px; margin: 0 auto; background: #1A1A1A; padding: 40px; border-radius: 16px; border: 1px solid #C9A84C;">
                                    <h1 style="color: #C9A84C; text-align: center; font-size: 28px;">🏛️ LEGADO SST</h1>
                                    <p style="text-align: center; color: #B7AE68; font-size: 14px;">Compliance OS para Industria 4.0</p>
                                    <hr style="border-color: #333;">
                                    <h2 style="text-align: center; color: #F5F0E8;">Código de Verificación</h2>
                                    <div style="font-size: 48px; text-align: center; color: #C9A84C; font-weight: bold; letter-spacing: 8px; background: #000; padding: 20px; border-radius: 12px; margin: 20px 0;">
                                        ${codigo}
                                    </div>
                                    <p style="text-align: center; color: #F5F0E8;">Este código es <strong>personal e intransferible</strong></p>
                                    <p style="text-align: center; color: #B7AE68; font-size: 13px;">⏱️ <strong>Válido por 5 minutos</strong></p>
                                    <hr style="border-color: #333;">
                                    <p style="text-align: center; color: #666; font-size: 12px;">LEGADO - Construyendo un futuro más seguro</p>
                                </div>
                            </body>
                            </html>
                        `
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    console.log('✅ Email enviado correctamente');
                    return true;
                } else {
                    console.error('Error Brevo:', data);
                    return false;
                }
            } catch (error) {
                console.error('Error al enviar email:', error);
                return false;
            }
        }

        async function enviarCodigoVerificacion() {
            const email = regEmail.value.trim();

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                emailFeedback.textContent = '❌ Ingresa un correo electrónico válido';
                emailFeedback.style.color = '#E74C3C';
                return;
            }

            const usuarios = JSON.parse(localStorage.getItem('legado_usuarios') || '[]');
            if (usuarios.find(u => u.email === email)) {
                emailFeedback.textContent = '❌ Este correo ya está registrado. Inicia sesión.';
                emailFeedback.style.color = '#E74C3C';
                return;
            }

            codigoActual = generarCodigo();
            codigoEnviado = false;

            btnVerificarEmail.textContent = '⏳ Enviando...';
            btnVerificarEmail.disabled = true;
            emailFeedback.textContent = '📤 Enviando código a ' + email + '...';
            emailFeedback.style.color = '#B7AE68';

            try {
                const enviado = await enviarCodigoBrevo(email, codigoActual);

                if (enviado) {
                    grupoCodigo.style.display = 'block';
                    codigoInput.value = '';
                    codigoInput.focus();
                    emailFeedback.textContent = '✅ Código enviado a ' + email + ' (revisa SPAM)';
                    emailFeedback.style.color = '#2ECC71';
                    btnVerificarEmail.textContent = '📧 Reenviar';
                    btnVerificarEmail.disabled = false;
                    codigoEnviado = true;
                    emailVerificado = false;

                    if (temporizadorExpiracion) clearTimeout(temporizadorExpiracion);
                    temporizadorExpiracion = setTimeout(() => {
                        if (!emailVerificado) {
                            emailFeedback.textContent = '⏰ El código ha expirado. Solicita uno nuevo.';
                            emailFeedback.style.color = '#E74C3C';
                            codigoEnviado = false;
                            btnVerificarEmail.textContent = '📧 Enviar código';
                        }
                    }, 300000);

                } else {
                    // MODO DEMO
                    console.warn('⚠️ Modo DEMO activado');
                    console.log('📧 CÓDIGO DEMO:', codigoActual);

                    grupoCodigo.style.display = 'block';
                    codigoInput.value = '';
                    codigoInput.focus();
                    emailFeedback.textContent = '⚠️ MODO DEMO: Revisa la consola (F12) o usa el código: ' + codigoActual;
                    emailFeedback.style.color = '#C9A84C';
                    btnVerificarEmail.textContent = '📧 Reenviar';
                    btnVerificarEmail.disabled = false;
                    codigoEnviado = true;
                    emailVerificado = false;

                    alert(`🔑 [MODO DEMO] Tu código de verificación es: ${codigoActual}\n\nIngresa este código en el campo de verificación.`);
                }

            } catch (error) {
                console.error('Error:', error);
                emailFeedback.textContent = '❌ Error al enviar el código. Intenta nuevamente.';
                emailFeedback.style.color = '#E74C3C';
                btnVerificarEmail.textContent = '📧 Reenviar';
                btnVerificarEmail.disabled = false;
            }
        }

        function confirmarCodigo() {
            const codigoIngresado = codigoInput.value.trim();

            if (!codigoEnviado) {
                emailFeedback.textContent = '❌ Primero solicita un código de verificación';
                emailFeedback.style.color = '#E74C3C';
                return;
            }

            if (!codigoIngresado || codigoIngresado.length < 6) {
                emailFeedback.textContent = '❌ Ingresa el código completo de 6 dígitos';
                emailFeedback.style.color = '#E74C3C';
                return;
            }

            if (codigoIngresado === codigoActual) {
                emailVerificado = true;
                emailFeedback.textContent = '✅ ¡Email verificado correctamente!';
                emailFeedback.style.color = '#2ECC71';
                btnConfirmarCodigo.textContent = '✅ Verificado';
                btnConfirmarCodigo.disabled = true;
                codigoInput.disabled = true;
                btnVerificarEmail.disabled = true;
                btnVerificarEmail.textContent = '✅ Verificado';

                actualizarBotonRegistro();
                console.log('✅ Email verificado:', regEmail.value);
            } else {
                emailFeedback.textContent = '❌ Código incorrecto. Intenta nuevamente.';
                emailFeedback.style.color = '#E74C3C';
                codigoInput.value = '';
                codigoInput.focus();
            }
        }

        function reenviarCodigoHandler(e) {
            e.preventDefault();
            if (regEmail.value.trim()) {
                emailVerificado = false;
                codigoEnviado = false;
                codigoActual = '';
                btnConfirmarCodigo.textContent = '✅ Confirmar';
                btnConfirmarCodigo.disabled = false;
                codigoInput.disabled = false;
                codigoInput.value = '';
                enviarCodigoVerificacion();
            } else {
                emailFeedback.textContent = '❌ Ingresa un correo electrónico primero';
                emailFeedback.style.color = '#E74C3C';
            }
        }

        // EVENTOS DE EMAIL
        btnVerificarEmail.addEventListener('click', enviarCodigoVerificacion);
        btnConfirmarCodigo.addEventListener('click', confirmarCodigo);
        reenviarLink.addEventListener('click', reenviarCodigoHandler);

        codigoInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmarCodigo();
            }
        });

        regEmail.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                enviarCodigoVerificacion();
            }
        });

        // ============================================
        //  ACTUALIZAR BOTÓN REGISTRO (SIN DNI)
        // ============================================
        function actualizarBotonRegistro() {
            const emailOk = regEmail.value.trim() !== '' && regEmail.value.includes('@');
            const passOk = regPassword.value.length >= 6;
            const terminosOk = checkTerminos.checked;
            const emailVerifOk = emailVerificado;

            if (emailOk && emailVerifOk && passOk && terminosOk) {
                btnRegister.disabled = false;
                btnRegister.textContent = '✅ Crear cuenta →';
            } else {
                btnRegister.disabled = true;
                if (!emailOk) btnRegister.textContent = 'Ingresa un correo válido';
                else if (!emailVerifOk) btnRegister.textContent = 'Verifica tu correo primero';
                else if (!passOk) btnRegister.textContent = 'Mínimo 6 caracteres';
                else if (!terminosOk) btnRegister.textContent = 'Acepta los términos';
                else btnRegister.textContent = 'Completa todos los campos';
            }
        }

        // ============================================
        //  EVENTOS DE VALIDACIÓN
        // ============================================
        regEmail.addEventListener('input', actualizarBotonRegistro);
        regPassword.addEventListener('input', actualizarBotonRegistro);
        checkTerminos.addEventListener('change', actualizarBotonRegistro);

        // ============================================
        //  REGISTRO (SIN DNI)
        // ============================================
        btnRegister.addEventListener('click', function(e) {
            e.preventDefault();

            if (!emailVerificado) {
                mensaje.textContent = '✖ Primero verifica tu correo electrónico';
                mensaje.className = 'mensaje error';
                return;
            }

            const email = regEmail.value.trim();
            const password = regPassword.value.trim();
            const nivel = regNivel.value;

            const usuarios = JSON.parse(localStorage.getItem('legado_usuarios') || '[]');

            if (usuarios.find(u => u.email === email)) {
                mensaje.textContent = '✖ Este correo ya está registrado';
                mensaje.className = 'mensaje error';
                return;
            }

            const nuevoUsuario = {
                email: email,
                password: password,
                nivel: nivel,
                email_verificado: true,
                fecha: new Date().toISOString()
            };

            usuarios.push(nuevoUsuario);
            localStorage.setItem('legado_usuarios', JSON.stringify(usuarios));

            localStorage.setItem('legado_sesion', JSON.stringify({
                email: nuevoUsuario.email,
                nivel: nuevoUsuario.nivel,
                email_verificado: true
            }));

            mensaje.textContent = '✓ ¡Cuenta creada exitosamente!';
            mensaje.className = 'mensaje exito';
            btnRegister.disabled = true;
            btnRegister.textContent = '✅ Cuenta creada';

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1200);
        });

        // ============================================
        //  INICIO
        // ============================================
        console.log('📝 LEGADO - Ventana de Registro (sin DNI)');
        console.log('📧 Brevo API Key configurada correctamente');
        actualizarBotonRegistro();
    </script>

</body>
</html>
