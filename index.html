            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;

        .idioma-btn:hover {

            color: #0A0A0A;
            transform: scale(1.05);

            color: #C9A84C;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(201, 168, 76, 0.3);

        .frase {
            color: #E8D5A3;
            font-size: 1rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .frase-destacada {

            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 20px;
            border-left: 3px solid #C9A84C;
            border-right: 3px solid #C9A84C;
        }

        .frase-destacada small {
            display: block;
            color: #8A7E6B;
            margin-top: 10px;
            font-style: italic;
        }

        .botones {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            cursor: pointer;
            border: none;
            min-width: 180px;
        }

        .btn-ingresar {
            background: #C9A84C;
            color: #0A0A0A;
        }

        .btn-ingresar:hover {
            background: #E8D5A3;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.4);
        }

        .btn-registro {
            background: transparent;
            color: #C9A84C;
            border: 2px solid #C9A84C;
        }

            background: #C9A84C;
            color: #0A0A0A;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.3);
        }

        .terminos {
            color: #8A7E6B;
            font-size: 0.8rem;
            margin: 20px 0;
        }

        .terminos a {
            color: #C9A84C;
            text-decoration: none;
        }

        .terminos a:hover {
            text-decoration: underline;
        }

        .footer {
            color: #8A7E6B;
            font-size: 0.75rem;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }
            .logo {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }

                justify-content: center;
                margin-bottom: 15px;
            }
            .idioma-btn {
                font-size: 0.6rem;
                padding: 3px 8px;
            }
            .botones {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                min-width: unset;
            }
        }
    </style>
</head>

<!-- LÓGICA DE CAMBIO DE IDIOMA                     -->
<!-- ============================================= -->
<script>
    (function() {
        // Elementos con data-key
        const elementos = {};
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (!elementos[key]) elementos[key] = [];
            elementos[key].push(el);
        });

        // Botones de idioma
        const botones = document.querySelectorAll('.idioma-btn');
        let idiomaActual = 'es';

        function cambiarIdioma(idioma) {
            if (!traducciones[idioma]) return;
            idiomaActual = idioma;

            // Actualizar textos
            const datos = traducciones[idioma];
            Object.keys(datos).forEach(key => {
                if (elementos[key]) {
                    elementos[key].forEach(el => {
                        if (el.tagName === 'A' || el.tagName === 'BUTTON' || el.tagName === 'SPAN') {
                            el.textContent = datos[key];
                        } else {
                            el.textContent = datos[key];
                        }
                    });
                }
            });

            // Actualizar botón activo
            botones.forEach(btn => {
                btn.classList.remove('activo');
                if (btn.getAttribute('data-lang') === idioma) {
                    btn.classList.add('activo');
                }
            });

            // Cambiar atributo lang del HTML
            document.documentElement.lang = idioma;
        }

        // Eventos de los botones
        botones.forEach(btn => {
            btn.addEventListener('click', function() {
                const lang = this.getAttribute('data-lang');
                cambiarIdioma(lang);
            });
        });

        // Cargar idioma guardado (opcional)
        const guardado = localStorage.getItem('legado-idioma');
        if (guardado && traducciones[guardado]) {
            cambiarIdioma(guardado);
        } else {
            // Detectar idioma del navegador
            const navLang = navigator.language.split('-')[0];
            if (traducciones[navLang]) {
                cambiarIdioma(navLang);
            } else {
                cambiarIdioma('es');
            }
        }

        // Guardar idioma al cambiar
        const originalCambiar = cambiarIdioma;
        cambiarIdioma = function(idioma) {
            originalCambiar(idioma);
            localStorage.setItem('legado-idioma', idioma);
        };
        // Sobrescribir para que guarde
        window.cambiarIdioma = cambiarIdioma;

    })();
</script>
