<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGADO SST - Bienvenida</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0A;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #1A1A1A;
            border: 2px solid #C9A84C;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 50px rgba(201, 168, 76, 0.2);
        }

        .logo {
            font-size: 3.5rem;
            font-weight: bold;
            color: #C9A84C;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
        }

        .frase {
            color: #E8D5A3;
            font-size: 1rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .frase-destacada {
            color: #F5F0E8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 20px;
            border-left: 3px solid #C9A84C;
            border-right: 3px solid #C9A84C;
        }

        .frase-destacada small {
            display: block;
            color: #8A7E6B;
            margin-top: 10px;
            font-style: italic;
        }

        .botones {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            cursor: pointer;
            border: none;
            min-width: 180px;
        }

        .btn-ingresar {
            background: #C9A84C;
            color: #0A0A0A;
        }

        .btn-ingresar:hover {
            background: #E8D5A3;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.4);
        }

        .btn-registro {
            background: transparent;
            color: #C9A84C;
            border: 2px solid #C9A84C;
        }

        .btn-registro:hover {
            background: #C9A84C;
            color: #0A0A0A;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.3);
        }

        .footer {
            color: #8A7E6B;
            font-size: 0.75rem;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        .terminos {
            color: #8A7E6B;
            font-size: 0.8rem;
            margin: 20px 0;
        }

        .terminos a {
            color: #C9A84C;
            text-decoration: none;
        }

        .terminos a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            .logo {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            .botones {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">LEGADO</div>
        <div class="frase">+ CONCIENCIA Y FUTURO PARA LA HUMANIDAD +</div>
        
        <div class="frase-destacada">
            "La seguridad laboral no debería ser un lujo. Es un derecho. Hazla automática."
            <small>— LEGADO</small>
        </div>

        <div class="botones">
            <a href="login.html" class="btn btn-ingresar">Ingresar</a>
            <a href="registro.html" class="btn btn-registro">Registrarse</a>
        </div>

        <div class="terminos">
            <a href="#">Acepto los Términos y Condiciones y la Política de Privacidad</a>
            <br>
            <a href="#">Manual de uso y atajos</a>
        </div>

        <div class="footer">
            LEGADO Seguridad Laboral Automática v1.0
        </div>
    </div>
</body>
</html>
